dev:
  script: |
    export PATH="$PATH:$HOME/go/bin" && cd /srv/projects/my/minecraft/minimin-sync && wails dev -tags webkit2_41 2>&1

build:
  script: wails build -tags webkit2_41 -skipbindings

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n "$tag" ]; then
      git tag -f "$tag"
      git push origin "$tag" --force
      git push
    else
      git push origin main
    fi

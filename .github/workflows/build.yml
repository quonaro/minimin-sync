name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux/amd64
          artifact: minimin-sync
          artifact_name: linux-amd64
        - os: windows-latest
          platform: windows/amd64
          artifact: minimin-sync.exe
          artifact_name: windows-amd64
        - os: macos-latest
          platform: darwin/universal
          artifact: minimin-sync.app
          artifact_name: darwin-universal

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build
      run: wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ github.sha }}"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimin-sync-${{ matrix.artifact_name }}
        path: build/bin/${{ matrix.artifact }}

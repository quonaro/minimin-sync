name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir release
        cp artifacts/minimin-sync-linux-amd64/minimin-sync release/minimin-sync-linux-amd64
        cp artifacts/minimin-sync-windows-amd64/minimin-sync.exe release/minimin-sync-windows-amd64.exe
        cp artifacts/minimin-sync-darwin-universal/minimin-sync-darwin-universal.zip release/minimin-sync-darwin-universal.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          platform: linux/amd64
          artifact: minimin-sync
          artifact_name: linux-amd64
        - os: windows-latest
          platform: windows/amd64
          artifact: minimin-sync.exe
          artifact_name: windows-amd64
        - os: macos-latest
          platform: darwin/universal
          artifact: minimin-sync.app
          artifact_name: darwin-universal

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev gcc

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build
      run: wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ github.sha }}"

    - name: Package macOS app
      if: matrix.os == 'macos-latest'
      run: cd build/bin && zip -r minimin-sync-darwin-universal.zip minimin-sync.app

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: minimin-sync-${{ matrix.artifact_name }}
        path: ${{ matrix.os == 'macos-latest' && 'build/bin/minimin-sync-darwin-universal.zip' || format('build/bin/{0}', matrix.artifact) }}

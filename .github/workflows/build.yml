name: Build

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare release files
      run: |
        mkdir release
        cp artifacts/minimin-sync-linux-amd64/minimin-sync release/minimin-sync-linux-amd64
        cp artifacts/minimin-sync-windows-amd64/minimin-sync.exe release/minimin-sync-windows-amd64.exe
        cp artifacts/minimin-sync-linux-appimage/minimin-sync-x86_64.AppImage release/minimin-sync-linux-x86_64.AppImage
        cp artifacts/minimin-sync-darwin-universal/minimin-sync-darwin-universal.zip release/minimin-sync-darwin-universal.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          platform: linux/amd64
          artifact: minimin-sync
          artifact_name: linux-amd64
        - os: windows-latest
          platform: windows/amd64
          artifact: minimin-sync.exe
          artifact_name: windows-amd64
        - os: macos-latest
          platform: darwin/universal
          artifact: minimin-sync.app
          artifact_name: darwin-universal

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Ensure tag is on main
      run: |
        git fetch origin main
        git merge-base --is-ancestor HEAD origin/main || (echo "Tag is not on main branch" && exit 1)

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.23'

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 20

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gcc

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build
      shell: bash
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="${{ github.sha }}"
        fi
        wails build -tags webkit2_41 -platform ${{ matrix.platform }} -ldflags "-X main.version=$VERSION"

    - name: Build AppImage
      if: matrix.os == 'ubuntu-22.04'
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
        chmod +x linuxdeploy-plugin-appimage-x86_64.AppImage

        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/192x192/apps

        cp build/bin/minimin-sync AppDir/usr/bin/
        cp frontend/public/favicon/web-app-manifest-192x192.png AppDir/usr/share/icons/hicolor/192x192/apps/minimin-sync.png

        cat > AppDir/usr/share/applications/minimin-sync.desktop <<EOF
        [Desktop Entry]
        Name=minimin-sync
        Exec=minimin-sync
        Icon=minimin-sync
        Type=Application
        Categories=Utility;
        EOF

        APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --output appimage

    - name: Package macOS app
      if: matrix.os == 'macos-latest'
      run: cd build/bin && zip -r minimin-sync-darwin-universal.zip minimin-sync.app

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: minimin-sync-${{ matrix.artifact_name }}
        path: ${{ matrix.os == 'macos-latest' && 'build/bin/minimin-sync-darwin-universal.zip' || format('build/bin/{0}', matrix.artifact) }}

    - name: Upload AppImage artifact
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-artifact@v7
      with:
        name: minimin-sync-linux-appimage
        path: minimin-sync-x86_64.AppImage
